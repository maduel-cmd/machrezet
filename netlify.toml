# מחרזת — Netlify
# https://machrezet-beads.netlify.app

[build]
  command = "npm run build"
  publish = "dist"
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
